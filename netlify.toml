[build]
  base = "apps/web"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The SPA fallback. There is deliberately no /api/* proxy here: the browser
# talks to https://api.convo.fawzxenon.com directly via VITE_API_URL, because
# Netlify redirects cannot carry WebSocket upgrades and the realtime gateway
# (wss://api.convo.fawzxenon.com/ws) would silently never connect through one.
#
# VITE_API_URL is read at build time. It is set in Netlify ▸ Site configuration
# ▸ Environment variables, and apps/web/vite.config.ts fails the build when it
# is missing in a Netlify production build.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
